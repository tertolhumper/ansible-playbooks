---
- name: Disaster Recovery - Backup
  hosts: all
  become: true
  vars:
    backup_base: /mnt/backup
    timestamp: "{{ ansible_facts['date_time']['date'] }}"
    backup_dirs:
      - /etc
      - /home
      - /var/log
      - /var/www
      - /opt
      - /root
    retention_days: 7

  tasks:

    - name: Create backup directory on control node
      ansible.builtin.file:
        path: "{{ backup_base }}/{{ inventory_hostname }}/{{ timestamp }}"
        state: directory
        owner: tertol
        group: tertol
        mode: '0755'
      delegate_to: localhost

    - name: Create tarball of critical directories
      ansible.builtin.shell: |
        tar --ignore-failed-read -czf /home/tertol/backup_{{ inventory_hostname }}_{{ timestamp }}.tar.gz \
        {% for dir in backup_dirs %}
        {{ dir }} \
        {% endfor %}
        2>/dev/null || true
      changed_when: true

    - name: Set tarball ownership to tertol
      ansible.builtin.file:
        path: /home/tertol/backup_{{ inventory_hostname }}_{{ timestamp }}.tar.gz
        owner: tertol
        group: tertol
        mode: '0640'

    - name: Fetch backup tarball to control node
      ansible.builtin.fetch:
        src: /home/tertol/backup_{{ inventory_hostname }}_{{ timestamp }}.tar.gz
        dest: "{{ backup_base }}/{{ inventory_hostname }}/{{ timestamp }}/"
        flat: true
      become: false

    - name: Remove tarball from remote host
      ansible.builtin.file:
        path: /home/tertol/backup_{{ inventory_hostname }}_{{ timestamp }}.tar.gz
        state: absent

    - name: Remove backups older than retention days
      ansible.builtin.shell: |
        find {{ backup_base }}/{{ inventory_hostname }} -maxdepth 1 -type d -mtime +{{ retention_days }} -exec rm -rf {} \;
      delegate_to: localhost
      changed_when: false

- name: Disaster Recovery - Restore
  hosts: all
  become: true
  vars:
    backup_base: /mnt/backup
  tasks:

    - name: Find latest backup
      ansible.builtin.shell: |
        ls -1t {{ backup_base }}/{{ inventory_hostname }}/ | head -1
      register: latest_backup
      delegate_to: localhost
      changed_when: false

    - name: Show latest backup found
      ansible.builtin.debug:
        msg: "Latest backup: {{ latest_backup.stdout }}"

    - name: Copy backup tarball to remote host
      ansible.builtin.copy:
        src: "{{ backup_base }}/{{ inventory_hostname }}/{{ latest_backup.stdout }}/backup_{{ inventory_hostname }}_{{ latest_backup.stdout }}.tar.gz"
        dest: /tmp/restore.tar.gz
        owner: root
        group: root
        mode: '0600'
      when: latest_backup.stdout != ""

    - name: Extract backup
      ansible.builtin.shell: |
        tar -xzf /tmp/restore.tar.gz -C /
      when: latest_backup.stdout != ""
      changed_when: true

    - name: Remove restore tarball
      ansible.builtin.file:
        path: /tmp/restore.tar.gz
        state: absent

    - name: Restart critical services
      ansible.builtin.service:
        name: "{{ item }}"
        state: restarted
      loop:
        - sshd
        - nginx
      ignore_errors: true
