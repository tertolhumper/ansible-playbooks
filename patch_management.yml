---
- name: Patch Management with Reboot Handling
  hosts: all
  become: true
  tasks:

    - name: Update all packages (Arch)
      community.general.pacman:
        update_cache: true
        upgrade: true
      when: ansible_facts['os_family'] == "Archlinux"
      register: arch_update

    - name: Update all packages (RHEL)
      ansible.builtin.dnf:
        name: '*'
        state: latest
        update_cache: true
      when: ansible_facts['os_family'] == "RedHat"
      register: rhel_update

    - name: Check if kernel was updated (RHEL)
      ansible.builtin.command: needs-restarting -r
      register: reboot_required_rhel
      failed_when: false
      changed_when: false
      when: ansible_facts['os_family'] == "RedHat"

    - name: Get running kernel version
      ansible.builtin.command: uname -r
      register: running_kernel
      changed_when: false

    - name: Get installed kernel versions
      ansible.builtin.shell: ls -1 /usr/lib/modules | sort -V | tail -n 1
      register: installed_kernel
      changed_when: false
      when: ansible_facts['os_family'] == "Archlinux"

    - name: Reboot if required (Arch)
      ansible.builtin.reboot:
        msg: "Rebooting after package updates"
        reboot_timeout: 300
      when:
        - ansible_facts['os_family'] == "Archlinux"
        - running_kernel.stdout != installed_kernel.stdout    

    - name: Reboot if required (RHEL)
      ansible.builtin.reboot:
        msg: "Rebooting after package updates"
        reboot_timeout: 300
      when:
        - ansible_facts['os_family'] == "RedHat"
        - reboot_required_rhel.rc == 1

    - name: Verify servers are back online
      ansible.builtin.ping:

    - name: Show upgraded packages (RHEL)
      ansible.builtin.command: dnf history info last
      when: ansible_facts.os_family == "RedHat"

