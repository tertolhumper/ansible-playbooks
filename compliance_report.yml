---
- name: Compliance Reporting
  hosts: all
  become: true
  tasks:

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Check failed systemd units
      ansible.builtin.command: systemctl --failed --no-legend
      register: failed_units
      changed_when: false

    - name: Check listening ports
      ansible.builtin.command: ss -tlnp
      register: open_ports
      changed_when: false

    - name: Check sudoers files
      ansible.builtin.find:
        paths: /etc/sudoers.d
        file_type: file
      register: sudoers_files

    - name: Check last logins
      ansible.builtin.command: last -n 10
      register: last_logins
      changed_when: false

    - name: Generate compliance report
      ansible.builtin.copy:
        dest: /tmp/compliance_report_{{ inventory_hostname }}.txt
        content: |
          ============================================================
          COMPLIANCE REPORT - {{ inventory_hostname }}
          Generated: {{ ansible_facts['date_time'].iso8601 }}
          OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
          Kernel: {{ ansible_facts['kernel'] }}
          Uptime: {{ ansible_facts['uptime_seconds'] | int // 3600 }} hours
          ============================================================
          FAILED SYSTEMD UNITS:
          {{ failed_units.stdout | default('None') }}
          ============================================================
          LISTENING PORTS:
          {{ open_ports.stdout }}
          ============================================================
          SUDOERS FILES:
          {{ sudoers_files.files | map(attribute='path') | join('\n') }}
          ============================================================
          LAST LOGINS:
          {{ last_logins.stdout }}
          ============================================================

    - name: Fetch report to control node
      ansible.builtin.fetch:
        src: /tmp/compliance_report_{{ inventory_hostname }}.txt
        dest: ~/ansible_tutorial/reports/
        flat: false
