
---
- name: Deploy Prometheus and Grafana via Helm
  hosts: rhel-node1
  become: true

  vars:
    helm_bin: /usr/local/bin/helm
    prometheus_ns: monitoring
    values_file_src: /home/tertol/sentinel-nsm-config/helm/prometheus/values.yaml
    values_file_dest: /etc/kubernetes/prometheus-values.yaml

  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

  tasks:
    - name: Add Prometheus community Helm repo
      ansible.builtin.command:
        cmd: "{{ helm_bin }} repo add prometheus-community https://prometheus-community.github.io/helm-charts"
      register: repo_add
      failed_when: repo_add.rc != 0 and 'already exists' not in repo_add.stderr
      changed_when: "'already exists' not in repo_add.stderr"

    - name: Update Helm repositories
      ansible.builtin.command:
        cmd: "{{ helm_bin }} repo update"
      changed_when: false

    - name: Create monitoring namespace
      ansible.builtin.command:
        cmd: kubectl create namespace {{ prometheus_ns }}
      register: ns_result
      failed_when: ns_result.rc != 0 and 'already exists' not in ns_result.stderr
      changed_when: "'already exists' not in ns_result.stderr"

    - name: Copy Prometheus values file to control plane
      ansible.builtin.copy:
        src: "{{ values_file_src }}"
        dest: "{{ values_file_dest }}"
        owner: root
        group: root
        mode: '0644'

    - name: Deploy or upgrade kube-prometheus-stack
      ansible.builtin.command:
        argv:
          - "{{ helm_bin }}"
          - upgrade
          - --install
          - kube-prometheus-stack
          - prometheus-community/kube-prometheus-stack
          - -n
          - "{{ prometheus_ns }}"
          - -f
          - "{{ values_file_dest }}"

    - name: Verify pods
      ansible.builtin.command:
        cmd: kubectl get pods -n {{ prometheus_ns }}
      register: pods_out
      changed_when: false

    - name: Show pods
      ansible.builtin.debug:
        msg: "{{ pods_out.stdout_lines }}"
