apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lemp-secrets
  namespace: lemp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: sentinel-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: VAULT_TOKEN
      remoteRef:
        key: lemp
        property: VAULT_TOKEN
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mariadb-secrets
  namespace: lemp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mariadb-passwords
    creationPolicy: Owner
  data:
    - secretKey: mariadb-password
      remoteRef:
        key: lemp
        property: mariadb-password
